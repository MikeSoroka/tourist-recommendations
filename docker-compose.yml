services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-tourist_recommendations}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${DB_PORT_PUBLISHED:-5432}:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT_PUBLISHED:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: runtime
    healthcheck:
      test:
        ["CMD", "python", "-c",
         "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 3s
      start_period: 10s
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tourist_recommendations}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_URL: redis://redis:6379/0
      IMAGES_DIR: /app/data/images
    volumes:
      - ./data:/app/data
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  detector:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "tourist.sync.cli", "run", "--job", "detect"]
    environment: &sync_env
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-tourist_recommendations}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      REDIS_URL: redis://redis:6379/0
      DETECT_INTERVAL_SECONDS: ${DETECT_INTERVAL_SECONDS:-3600}
      CONSUME_INTERVAL_SECONDS: ${CONSUME_INTERVAL_SECONDS:-60}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  refresher:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "tourist.sync.cli", "run", "--job", "consume"]
    environment: *sync_env
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  collector:
    build:
      context: .
      target: tools
    profiles: ["tools"]
    environment: *sync_env
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
