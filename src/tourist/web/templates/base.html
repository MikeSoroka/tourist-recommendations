<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tourist Recommendations{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
        .similar-place-img {
            height: 100px;
            object-fit: cover;
        }
        .place-main-img {
            height: 400px;
            object-fit: cover;
        }
        .thumbnail-gallery {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .thumbnail {
            width: 100px;
            height: 100px;
            object-fit: cover;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .thumbnail:hover {
            opacity: 0.8;
        }
        .nav-breadcrumb {
            background-color: #f8f9fa;
            padding: 10px 0;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('main.index') }}">Tourist Recommendations</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('main.index') }}">Cities</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="nav-breadcrumb">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    {% block breadcrumb %}
                    <li class="breadcrumb-item"><a href="{{ url_for('main.index') }}">Home</a></li>
                    {% endblock %}
                </ol>
            </nav>
        </div>
    </div>

    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-dark text-light py-4 mt-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6">
                    <h5>Tourist Recommendations</h5>
                    <p>Discover the most interesting places in cities around the world.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <p>Data from <a href="https://en.wikipedia.org" class="text-light">Wikipedia</a> &middot; Released under the MIT License</p>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Function to update main image when clicking thumbnails
        function updateMainImage(src) {
            document.getElementById('mainImage').src = src;
        }
    </script>
</body>
</html>
